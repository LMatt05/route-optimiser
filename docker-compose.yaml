services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/map.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

  api:
    build: .
    depends_on:
      - osrm
    environment:
      OSRM_BASE_URL: http://osrm:5000
      MAP_BOUNDS_SOUTH: ${MAP_BOUNDS_SOUTH:-51.28}
      MAP_BOUNDS_WEST: ${MAP_BOUNDS_WEST:--0.52}
      MAP_BOUNDS_NORTH: ${MAP_BOUNDS_NORTH:-51.70}
      MAP_BOUNDS_EAST: ${MAP_BOUNDS_EAST:-0.34}
    ports:
      - "8080:8080"
    restart: unless-stopped