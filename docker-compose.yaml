services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/map.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

  api:
    build: .
    depends_on:
      - osrm
    environment:
      OSRM_BASE_URL: http://osrm:5000
    ports:
      - "8080:8080"
    restart: unless-stopped